name: Execution Worker CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

concurrency:
  group: execution-worker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ororura/tutorplatform-execution-worker
  SANDBOX_PYTHON_IMAGE: >-
    python:3.12.10-alpine3.21@sha256:9c51ecce261773a684c8345b2d4673700055c513b4d54bc0719337d3e4ee552e

jobs:
  checks:
    name: Execution worker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean build --no-daemon

  sandbox-integration:
    name: Docker sandbox integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare Docker sandbox image
        run: |
          docker info
          docker pull "${SANDBOX_PYTHON_IMAGE}"

      - name: Run Docker sandbox integration tests
        run: ./gradlew sandboxIntegrationTest --no-daemon

      - name: Remove sandbox containers
        if: always()
        run: |
          mapfile -t containers < <(
            docker ps --all --quiet --filter "label=com.tutorplatform.execution=true"
          )
          if (( ${#containers[@]} > 0 )); then
            docker rm --force "${containers[@]}"
          fi

  docker:
    name: Build and scan production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs:
      - checks
      - sandbox-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
          output: trivy-results.txt
          timeout: 10m
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Show Trivy findings
        if: ${{ always() && hashFiles('trivy-results.txt') != '' }}
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' "$IMAGE_NAME:${{ github.sha }}"
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version
          cat trivy-results.txt
          {
            echo '## Production image vulnerabilities (HIGH/CRITICAL)'
            echo '```text'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            set -e

            cd /opt/tutorplatform

            docker compose pull execution-worker
            docker compose up -d execution-worker

            docker image prune -f
          EOF
