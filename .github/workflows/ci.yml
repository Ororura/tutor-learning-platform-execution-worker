name: Execution Worker CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

concurrency:
  group: execution-worker-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ororura/tutorplatform-execution-worker
  SANDBOX_PYTHON_IMAGE: >-
    python:3.12.10-alpine3.21@sha256:9c51ecce261773a684c8345b2d4673700055c513b4d54bc0719337d3e4ee552e

jobs:
  delivery-checks:
    name: Deployment verification tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compile operational scripts
        run: python3 -m compileall -q scripts tests/ops
      - name: Smoke, deployment and Compose regression tests
        run: python3 -m unittest discover -s tests/ops -v
      - name: Validate GitHub Actions and embedded shell
        run: |
          docker run --rm --network none --workdir /repo \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            rhysd/actionlint:1.7.12 .github/workflows/ci.yml

  checks:
    name: Execution worker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean build --no-daemon

  sandbox-integration:
    name: Docker sandbox integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare Docker sandbox image
        run: |
          docker info
          docker pull "${SANDBOX_PYTHON_IMAGE}"
          docker build -f Dockerfile.runtime-java -t tutor-java-runtime:21 .

      - name: Run Docker sandbox integration tests
        run: ./gradlew sandboxIntegrationTest --no-daemon

      - name: Remove sandbox containers
        if: always()
        run: |
          mapfile -t containers < <(
            docker ps --all --quiet --filter "label=com.tutorplatform.execution=true"
          )
          if (( ${#containers[@]} > 0 )); then
            docker rm --force "${containers[@]}"
          fi

  docker:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    name: Build and scan production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs:
      - checks
      - delivery-checks
      - sandbox-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
          output: trivy-results.txt
          timeout: 10m
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Show Trivy findings
        if: ${{ always() && hashFiles('trivy-results.txt') != '' }}
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' "$IMAGE_NAME:${{ github.sha }}"
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version
          cat trivy-results.txt
          {
            echo '## Production image vulnerabilities (HIGH/CRITICAL)'
            echo '```text'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_NAME:${{ github.sha }}" | awk -v repo="$IMAGE_NAME@" 'index($0, repo) == 1 {print; exit}')
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing published image digest'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published commit=${{ github.sha }} repository=$IMAGE_NAME tag=${{ github.sha }} digest=$digest"
          echo "Published image: $IMAGE_NAME:${{ github.sha }}@$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy immutable image to production and demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
      IMAGE_SHA: ${{ github.sha }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL || 'https://tutor.ororura.site' }}
      DEMO_PUBLIC_BASE_URL: ${{ vars.DEMO_PUBLIC_BASE_URL || 'https://demo.ororura.site' }}
    steps:
      - name: Checkout deployment scripts from this commit
        uses: actions/checkout@v7
      - name: Setup SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/tutorplatform_deploy
          chmod 600 ~/.ssh/tutorplatform_deploy
          ssh-keygen -y -f ~/.ssh/tutorplatform_deploy > /dev/null
          [[ "$SERVER_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid SERVER_SSH_PORT'; exit 1; }
          port=$((10#$SERVER_SSH_PORT))
          (( port >= 1 && port <= 65535 )) || { echo 'Invalid SERVER_SSH_PORT'; exit 1; }
          ssh-keyscan -t ed25519 -T 10 -p "$SERVER_SSH_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy exact scanned digest and verify both environments
        run: python3 scripts/deploy_remote.py
